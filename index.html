<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help Desk Pro</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<section id="login" class="login"><h1>Help Desk Pro</h1><p>Central de suporte técnico</p><form id="loginForm"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" required></label><button>Entrar</button></form></section>
<div id="workspace" hidden><aside><h2>HELP DESK <small>PRO</small></h2><button id="home">Dashboard</button><button id="newTicket">Novo chamado</button><button id="newUser" hidden>Novo técnico</button><a href="/docs" target="_blank" rel="noopener">Documentação API</a><button id="logout">Sair</button></aside><main><header><div><h1>Dashboard</h1><p id="welcome"></p></div><button id="refresh">Atualizar</button></header><section id="metrics"></section><section class="panel"><h2>Chamados</h2><div class="filters"><input id="search" placeholder="Pesquisar chamado ou cliente"><select id="filter"><option value="">Todos os status</option><option value="open">Abertos</option><option value="progress">Em atendimento</option><option value="resolved">Resolvidos</option></select></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>Chamado</th><th>Cliente</th><th>Prioridade</th><th>Status</th><th>Técnico</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div>
<dialog id="ticketDialog"><form id="ticketForm"><h2>Chamado</h2><input name="id" type="hidden"><label>Título<input name="title" maxlength="160" required></label><label>Cliente<input name="customer" maxlength="120" required></label><label>Descrição<textarea name="description" maxlength="10000" required></textarea></label><label>Prioridade<select name="priority"><option value="normal">Normal</option><option value="low">Baixa</option><option value="high">Alta</option><option value="urgent">Urgente</option></select></label><label>Status<select name="status"><option value="open">Aberto</option><option value="progress">Em atendimento</option><option value="resolved">Resolvido</option></select></label><label>Técnico<select name="assigned_to" id="assignee"></select></label><button>Salvar</button><button type="button" class="cancel">Cancelar</button></form></dialog>
<dialog id="userDialog"><form id="userForm"><h2>Novo técnico</h2><label>Nome<input name="name" required maxlength="120"></label><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" minlength="12" required></label><button>Cadastrar</button><button type="button" class="cancel">Cancelar</button></form></dialog><div id="message" role="status"></div></body></html>
